name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Sonata.Avalonia.slnx

      - name: Build (Release)
        run: dotnet build Sonata.Avalonia.slnx -c Release -maxcpucount:1

      - name: Unit tests
        run: dotnet test tests/Sonata.Avalonia.Tests/Sonata.Avalonia.Tests.csproj -c Release --no-build

      - name: Headless tests
        run: dotnet test tests/Sonata.Avalonia.Headless.Tests/Sonata.Avalonia.Headless.Tests.csproj -c Release --no-build
