name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Sonata.Avalonia.slnx

      - name: Build (Release)
        run: dotnet build Sonata.Avalonia.slnx -c Release -maxcpucount:1

      - name: Unit tests
        run: dotnet test tests/Sonata.Avalonia.Tests/Sonata.Avalonia.Tests.csproj -c Release --no-build

      - name: Headless tests
        run: dotnet test tests/Sonata.Avalonia.Headless.Tests/Sonata.Avalonia.Headless.Tests.csproj -c Release --no-build
