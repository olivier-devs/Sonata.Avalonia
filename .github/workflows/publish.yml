name: Publish

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # grep -oP requires GNU grep (available on ubuntu runners); fallback: sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match Directory.Build.props version $VERSION"
            exit 1
          fi

      - name: Restore
        run: dotnet restore Sonata.Avalonia.slnx

      - name: Build (Release)
        run: dotnet build Sonata.Avalonia.slnx -c Release -maxcpucount:1

      - name: Unit tests
        run: dotnet test tests/Sonata.Avalonia.Tests/Sonata.Avalonia.Tests.csproj -c Release --no-build

      - name: Headless tests
        run: dotnet test tests/Sonata.Avalonia.Headless.Tests/Sonata.Avalonia.Headless.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack Sonata.Avalonia.slnx -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkgs
          path: artifacts/*.nupkg

  publish-github:
    needs: build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkgs
          path: artifacts
      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

  publish-nugetorg:
    needs: build
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkgs
          path: artifacts
      - name: Push to nuget.org
        if: ${{ env.NUGET_API_KEY != '' }}
        run: dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ env.NUGET_API_KEY }}
          --skip-duplicate
