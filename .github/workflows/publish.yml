name: Publish

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match Directory.Build.props version $VERSION"
            exit 1
          fi

      - name: Restore
        run: dotnet restore Sonata.Avalonia.slnx

      - name: Build (Release)
        run: dotnet build Sonata.Avalonia.slnx -c Release -maxcpucount:1

      - name: Unit tests
        run: dotnet test tests/Sonata.Avalonia.Tests/Sonata.Avalonia.Tests.csproj -c Release --no-build

      - name: Headless tests
        run: dotnet test tests/Sonata.Avalonia.Headless.Tests/Sonata.Avalonia.Headless.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack Sonata.Avalonia.slnx -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: artifacts/*.nupkg

  publish-github:
    needs: build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: nupkgs
          path: artifacts
      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

  publish-nugetorg:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ secrets.NUGET_API_KEY != '' }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: nupkgs
          path: artifacts
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_API_KEY }}
          --skip-duplicate
